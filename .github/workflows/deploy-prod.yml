name: Deploy Prod

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1

      # Fails fast if prod's schema isn't already at the revision this code
      # expects, instead of shipping code against a schema that doesn't
      # exist -- run the MigrationRunner Step Function manually first.
      #
      # Note: on the very first-ever deploy, this function doesn't exist
      # yet -- that first deploy has to be done manually to bootstrap the
      # stack. Every deploy after that goes through this workflow.
      - name: Check prod schema is at head
        run: |
          make migrate-check
          UP_TO_DATE=$(python3 -c "import json; print(json.load(open('response.json')).get('up_to_date'))")
          if [ "$UP_TO_DATE" != "True" ]; then
            echo "::error::Prod schema is not at head. Run the MigrationRunner Step Function before merging."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: make sam-build

      - name: Deploy
        run: make deploy-prod SAM_ARTIFACTS_BUCKET=${{ vars.SAM_ARTIFACTS_BUCKET }}
