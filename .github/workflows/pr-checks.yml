name: PR Checks

on:
  pull_request:
    branches: [main]

# No AWS credentials needed at all -- lint, tests, and sam validate/build
# are all local-only checks. This job is a pure gate; deploy-branch.yml
# handles the actual AWS deploy separately.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: make install

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Validate templates
        run: make sam-validate

      - name: Build app stack
        run: make sam-build
