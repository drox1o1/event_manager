name: Deploy PR Branch Stack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# id-token: write is what lets configure-aws-credentials exchange this
# workflow's OIDC token for cyrokx-ci-role -- no static AWS keys anywhere.
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Underscore-based token: safe as a Postgres schema/role-free
      # identifier (unquoted) and as a SAM Stage parameter, everywhere,
      # without needing to special-case hyphens in SQL. The stack name
      # (which CloudFormation requires to be hyphen-based, no underscores)
      # is derived from the same token separately.
      - name: Derive stage from branch
        id: stage
        run: |
          RAW="${{ github.head_ref }}"
          TOKEN=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//' | cut -c1-20)
          echo "stage=pr_${TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: make sam-build

      - name: Deploy
        run: make deploy-branch STAGE=${{ steps.stage.outputs.stage }} SAM_ARTIFACTS_BUCKET=${{ vars.SAM_ARTIFACTS_BUCKET }}

      # Throwaway PR schema -- migrations run automatically here, no manual
      # gate, unlike deploy-prod.yml's check-then-fail-fast pattern.
      - name: Run migrations against this branch's schema
        run: make migrate-upgrade STAGE=${{ steps.stage.outputs.stage }}

      - name: Get API URL
        id: api
        run: echo "url=$(make api-url STAGE=${{ steps.stage.outputs.stage }})" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview stack deployed: ${{ steps.api.outputs.url }}`
            })
