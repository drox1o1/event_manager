name: Deploy PR Branch Stack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# id-token: write is what lets configure-aws-credentials exchange this
# workflow's OIDC token for cyrokx-ci-role -- no static AWS keys anywhere.
permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Underscore-based token: safe as a Postgres schema/role-free
      # identifier (unquoted) and as a SAM Stage parameter, everywhere,
      # without needing to special-case hyphens in SQL. The stack name
      # (which CloudFormation requires to be hyphen-based, no underscores)
      # is derived from the same token separately.
      - name: Derive stage and stack name from branch
        id: stage
        run: |
          RAW="${{ github.head_ref }}"
          TOKEN=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//' | cut -c1-20)
          echo "stage=pr_${TOKEN}" >> "$GITHUB_OUTPUT"
          echo "stack_name=cyrokx-app-pr-$(echo "$TOKEN" | tr '_' '-')" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: aws-actions/setup-sam@v2

      - name: Build
        run: sam build --template infra/app/template.yaml

      - name: Deploy
        run: |
          sam deploy \
            --stack-name "${{ steps.stage.outputs.stack_name }}" \
            --s3-bucket "${{ vars.SAM_ARTIFACTS_BUCKET }}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "Stage=${{ steps.stage.outputs.stage }} DbSchema=${{ steps.stage.outputs.stage }}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Throwaway PR schema -- migrations run automatically here, no manual
      # gate, unlike deploy-prod.yml's check-then-fail-fast pattern.
      - name: Run migrations against this branch's schema
        run: |
          aws lambda invoke \
            --function-name "cyrokx-migration-runner-${{ steps.stage.outputs.stage }}" \
            --payload "$(echo -n '{"mode":"upgrade","schema":"${{ steps.stage.outputs.stage }}"}' | base64)" \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

      - name: Get API URL
        id: api
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${{ steps.stage.outputs.stack_name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"

      - uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview stack deployed: ${{ steps.api.outputs.url }}`
            })
