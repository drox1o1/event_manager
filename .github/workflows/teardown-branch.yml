name: Teardown PR Branch Stack

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Derive stage from branch
        id: stage
        run: |
          RAW="${{ github.head_ref }}"
          TOKEN=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//' | cut -c1-20)
          echo "stage=pr_${TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CI_ROLE_ARN }}
          aws-region: ap-south-1

      # Drop the schema BEFORE deleting the stack -- once the stack (and its
      # migration_runner function) is gone, there's no way left to reach the
      # database to clean it up.
      - name: Drop the branch's Postgres schema
        run: make migrate-drop-schema STAGE=${{ steps.stage.outputs.stage }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Delete stack
        run: make teardown-branch STAGE=${{ steps.stage.outputs.stage }}
