name: Teardown PR Branch Stack

on:
  pull_request:
    types: [closed]
    branches: [main]
  # Manual cleanup of a leftover PR stack, e.g. stage=pr_develop.
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to tear down (pr_<branch>)"
        required: true

permissions:
  contents: read

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      # The make targets below live in the repo; without a checkout there is no Makefile.
      - uses: actions/checkout@v4

      - name: Derive stage from branch
        id: stage
        run: |
          if [ -n "${{ inputs.stage }}" ]; then
            case "${{ inputs.stage }}" in pr_*) echo "stage=${{ inputs.stage }}" >> "$GITHUB_OUTPUT"; exit 0;; *) echo "Only pr_* stages can be torn down" && exit 1;; esac
          fi
          RAW="${{ github.head_ref }}"
          TOKEN=$(echo "$RAW" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/_/g; s/^_+//; s/_+$//' | cut -c1-20)
          echo "stage=pr_${TOKEN}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # Drop the schema BEFORE deleting the stack -- once the stack (and its
      # migration_runner function) is gone, there's no way left to reach the
      # database to clean it up.
      - name: Drop the branch's Postgres schema
        run: make migrate-drop-schema STAGE=${{ steps.stage.outputs.stage }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Delete stack
        run: make teardown-branch STAGE=${{ steps.stage.outputs.stage }}
