            Auth:
              Authorizer: JwtAuthorizer
        UnpublishEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/events/{event_id}/unpublish
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        FeatureEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/events/{event_id}/feature
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ApproveOrganiser:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}/approve
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        RejectOrganiser:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}/reject
            Method: post
            Auth:
              Authorizer: JwtAuthorizer

  # --- payment_webhook (stub) ---

  PaymentWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-payment-webhook-${Stage}
      CodeUri: ../../src/payment_webhook/
      Handler: handler.handler
      Layers:
        - !Ref CommonLayer
      Events:
        Webhook:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /payments/webhook
            Method: post
            Auth:
              Authorizer: NONE

  # --- ticket_generator (stub) ---

  TicketGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-ticket-generator-${Stage}
      CodeUri: ../../src/ticket_generator/
      Handler: handler.handler
      Layers:
        - !Ref CommonLayer
      Events:
        OrderCompleted:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderCompletedQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # --- email_sender (stub) ---

  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-email-sender-${Stage}
      CodeUri: ../../src/email_sender/
      Handler: handler.handler
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          EMAIL_FROM_ADDRESS: !Ref EmailFromAddress
          EMAIL_FROM_NAME: Showtik
          PUBLIC_SITE_URL: !Ref PublicSiteUrl
          ORGANISER_PORTAL_URL: !Ref OrganiserPortalUrl
          ADMIN_PANEL_URL: !Ref AdminPanelUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        EmailQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt EmailQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # --- migration_runner ---
  # DDL-capable: uses the RDS master secret (never the restricted app role),
  # and additionally needs AppDbSecret read access since the initial
  # migration creates/updates the cyrokx_app Postgres role from it.

  MigrationRunnerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-migration-runner-${Stage}
      CodeUri: ../../src/migration_runner/
      Handler: handler.handler
      Timeout: 60
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Split [',', !ImportValue cyrokx-network-data-PrivateSubnetIds]
        SecurityGroupIds:
          - !ImportValue cyrokx-network-data-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue cyrokx-network-data-MasterDbSecretArn
          APP_DB_SECRET_ARN: !ImportValue cyrokx-network-data-AppDbSecretArn
          DB_PROXY_HOST: !ImportValue cyrokx-network-data-DbProxyEndpoint
          DB_NAME: !ImportValue cyrokx-network-data-DbName
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !ImportValue cyrokx-network-data-MasterDbSecretArn
                - !ImportValue cyrokx-network-data-AppDbSecretArn

  # --- Migration Step Function (prod: manually started; PR stacks: see
  #     deploy-branch.yml, which invokes MigrationRunnerFunction directly
  #     in upgrade mode instead of going through this state machine) ---

  MigrationRunnerStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub cyrokx-migration-runner-${Stage}
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref MigrationRunnerFunction
      Definition:
        Comment: Manually-started prod schema migration
        StartAt: RunMigration
        States:
          RunMigration:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: !GetAtt MigrationRunnerFunction.Arn
              Payload:
                mode: upgrade
            Retry:
              - ErrorEquals: ["States.ALL"]
                IntervalSeconds: 5
                MaxAttempts: 2
                BackoffRate: 2.0
            Catch:
              - ErrorEquals: ["States.ALL"]
                Next: MigrationFailed
            Next: MigrationSucceeded
          MigrationSucceeded:
            Type: Succeed
          MigrationFailed:
            Type: Fail

  # --- SQS ---

  OrderCompletedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cyrokx-order-completed-${Stage}
      VisibilityTimeout: 60

  EmailQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cyrokx-email-${Stage}
      VisibilityTimeout: 60

  # --- S3 ---

  BannersBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub
        - cyrokx-banners-${ResolvedStage}-${AWS::AccountId}
        - ResolvedStage: !If [HasBucketStage, !Ref BucketStage, !Ref Stage]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: ["*"]
            AllowedHeaders: ["*"]

  # Bucket itself stays fully private (PublicAccessBlockConfiguration above)
  # -- uploaded images are served to browsers through this distribution
  # instead, via Origin Access Control below, rather than the bucket's own
  # (blocked) public URL. create_banner_upload_url/create_image_upload_url
  # in authenticated_api return BANNERS_CDN_DOMAIN-based URLs, not raw S3
  # ones, for exactly this reason.
  BannersOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub cyrokx-banners-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  BannersDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultCacheBehavior:
          TargetOriginId: banners-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        Origins:
          - Id: banners-s3-origin
            DomainName: !GetAtt BannersBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt BannersOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""

  BannersBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BannersBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${BannersBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${BannersDistribution}

Outputs:
  ApiUrl:
    Description: Base invoke URL for smoke-testing the deployed stack
    Value: !Sub https://${CyrokxApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/
  MigrationRunnerFunctionArn:
    Value: !GetAtt MigrationRunnerFunction.Arn
  MigrationRunnerStateMachineArn:
    Value: !Ref MigrationRunnerStateMachine
