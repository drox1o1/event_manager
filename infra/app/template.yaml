AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  CyRokx app layer -- 8 Lambdas, API Gateway, SQS, the migration Step
  Function, S3. Deployed by CI: as cyrokx-app-prod on merge to main, or as
  cyrokx-app-pr-<branch> on PR open/update. Never manages network-data
  (VPC/RDS) -- only imports its outputs.

Parameters:
  Stage:
    Type: String
    Default: prod
    Description: prod, or a sanitized branch name for PR-branch preview stacks
  DbSchema:
    Type: String
    Default: ""
    Description: >
      Empty for prod (uses Postgres's default "public" schema). Set to the
      same sanitized branch name as Stage for PR-branch stacks, which share
      one RDS instance but get their own Postgres schema each.
  BucketStage:
    Type: String
    Default: ""
    Description: >
      Hyphen-safe version of Stage, used only for BannersBucket's name --
      S3 bucket names disallow underscores, but Stage's value for PR-branch
      stacks is underscore-based (it doubles as DbSchema, a Postgres
      identifier, where hyphens aren't safe unquoted). Empty for prod/dev,
      where Stage is already a single hyphen-safe token and this falls back
      to it; PR-branch deploys pass this explicitly (see Makefile's
      deploy-branch target).

  EmailFromAddress:
    Type: String
    Default: no-reply@showtik.in
    Description: >
      Sender for transactional email. Must be an SES-verified identity (the
      address or its whole domain) in this account/region. While SES is in
      sandbox mode, recipients must be verified too.
  PublicSiteUrl:
    Type: String
    Default: https://showtik.in
  OrganiserPortalUrl:
    Type: String
    Default: https://host.showtik.in
  AdminPanelUrl:
    Type: String
    Default: https://admin.showtik.in
    Description: >
      Used to build links in admin-facing emails (e.g. organiser-approval
      notices). Defaults to prod's domain -- non-prod deploys (dev, PR
      branches) should override this alongside PublicSiteUrl/
      OrganiserPortalUrl, or admin email links silently point at prod.
  PayUEnvironment:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, live]
    Description: >
      Only meaningful on prod (Stage=prod) -- every other stage always gets
      sandbox credentials regardless of this value, so a dev or PR stack can
      never read the live merchant key. Defaults to sandbox so a plain prod
      deploy never silently goes live: switch this to "live" explicitly
      (e.g. `make deploy-prod PAYU_ENVIRONMENT=live`) once real PayU merchant
      credentials have been put in cyrokx/payu. Until then, prod paid
      checkout hands buyers to PayU's sandbox -- real cards are declined
      there, so no real payment succeeds either way; this only changes which
      failure the buyer sees.

Conditions:
  HasDbSchema: !Not [!Equals [!Ref DbSchema, ""]]
  HasBucketStage: !Not [!Equals [!Ref BucketStage, ""]]
  # Gates whether the reconciler's schedule runs. Every open PR deploys a full
  # stack, so an unconditional schedule would mean N reconcilers polling PayU
  # and the shared RDS at once.
  IsProd: !Equals [!Ref Stage, prod]
  # Which PayU secret gets wired in. True only for prod with PayUEnvironment
  # explicitly set to "live" -- every other combination (non-prod, or prod
  # left on its sandbox default) resolves to the test secret, so there is
  # exactly one way to put live credentials in front of real buyers: an
  # explicit, visible parameter, not an implicit consequence of Stage=prod.
  ProdWantsLivePayU: !And
    - !Condition IsProd
    - !Equals [!Ref PayUEnvironment, live]

Globals:
  Function:
    Runtime: python3.13
    Timeout: 15
    MemorySize: 256
    Tracing: Active
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: cyrokx
        LOG_LEVEL: INFO

Resources:

  # --- Shared layer ---

  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub cyrokx-common-${Stage}
      ContentUri: ../../src/layers/common/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: python3.13

  # --- API Gateway ---

  CyrokxApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cyrokx-${Stage}
      StageName: !Ref Stage
      # AllowOrigin '*' matches BannersBucket's own CORS policy below --
      # tighten to real frontend origins before production launch.
      Cors:
        AllowMethods: "'GET,POST,PATCH,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt AuthorizerFunction.Arn
            Identity:
              Header: Authorization
            AuthorizerResultTtlInSeconds: 300

  # --- Authorizer ---

  AuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-authorizer-${Stage}
      CodeUri: ../../src/authorizer/
      Handler: handler.handler
      Layers:
        - !Ref CommonLayer
      Environment:
        Variables:
          JWT_SECRET_ARN: !ImportValue cyrokx-network-data-JwtSigningSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !ImportValue cyrokx-network-data-JwtSigningSecretArn

  # --- public_api ---

  PublicApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-public-api-${Stage}
      CodeUri: ../../src/public_api/
      Handler: handler.handler
      # Longer than the 15s default because of /payments/payu/return, which
      # makes an outbound verify call to PayU (8s) and, when a paid order can no
      # longer be fulfilled, a refund call too -- two sequential 8s budgets that
      # would otherwise time the buyer's redirect out into a 502. A timeout is a
      # ceiling, not a reservation, so the browse routes are unaffected.
      # Effectively 29s: API Gateway caps integration time there regardless.
      Timeout: 30
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Split [',', !ImportValue cyrokx-network-data-PrivateSubnetIds]
        SecurityGroupIds:
          - !ImportValue cyrokx-network-data-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue cyrokx-network-data-AppDbSecretArn
          DB_PROXY_HOST: !ImportValue cyrokx-network-data-DbProxyEndpoint
          DB_NAME: !ImportValue cyrokx-network-data-DbName
          DB_SCHEMA: !If [HasDbSchema, !Ref DbSchema, !Ref AWS::NoValue]
          EMAIL_QUEUE_URL: !Ref EmailQueue
          PAYU_SECRET_ARN: !If
            - ProdWantsLivePayU
            - !ImportValue cyrokx-network-data-PayUSecretArn
            - !ImportValue cyrokx-network-data-PayUTestSecretArn
          # Where the PayU return route sends the buyer afterwards. Built from
          # this plus the order id only -- never from anything PayU posts, since
          # that route is unauthenticated and would become an open redirect.
          PUBLIC_SITE_URL: !Ref PublicSiteUrl
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              # The ProdWantsLivePayU branch is what makes a dev or PR stack --
              # and prod left on its sandbox default -- physically unable to
              # read the live merchant key, not merely configured not to.
              Resource:
                - !ImportValue cyrokx-network-data-AppDbSecretArn
                - !If
                  - ProdWantsLivePayU
                  - !ImportValue cyrokx-network-data-PayUSecretArn
                  - !ImportValue cyrokx-network-data-PayUTestSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EmailQueue.QueueName
      Events:
        PayUReturn:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /payments/payu/return
            Method: post
            # PayU's browser redirect carries no Authorization header.
            Auth:
              Authorizer: NONE
        RetryPayment:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /orders/{order_id}/payu/retry
            Method: post
            Auth:
              Authorizer: NONE
        ListEvents:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /events
            Method: get
            Auth:
              Authorizer: NONE
        GetEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /events/{event_id}
            Method: get
            Auth:
              Authorizer: NONE
        GetEventFormFields:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /events/{event_id}/form-fields
            Method: get
            Auth:
              Authorizer: NONE
        ListCategories:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /categories
            Method: get
            Auth:
              Authorizer: NONE
        GetHomepage:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /homepage
            Method: get
            Auth:
              Authorizer: NONE
        GetSiteChrome:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /site-chrome
            Method: get
            Auth:
              Authorizer: NONE
        GetSitePage:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /site-pages/{slug}
            Method: get
            Auth:
              Authorizer: NONE
        Checkout:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /events/{event_id}/checkout
            Method: post
            Auth:
              Authorizer: NONE
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /orders/{order_id}
            Method: get
            Auth:
              Authorizer: NONE
        CreateRefundRequest:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /orders/{order_id}/refund-request
            Method: post
            Auth:
              Authorizer: NONE
        CreateOrderQuery:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /orders/{order_id}/query
            Method: post
            Auth:
              Authorizer: NONE
        GetOrganiserPage:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organisers/{organiser_id}
            Method: get
            Auth:
              Authorizer: NONE

  # --- authenticated_api ---

  AuthenticatedApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-authenticated-api-${Stage}
      CodeUri: ../../src/authenticated_api/
      Handler: handler.handler
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Split [',', !ImportValue cyrokx-network-data-PrivateSubnetIds]
        SecurityGroupIds:
          - !ImportValue cyrokx-network-data-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue cyrokx-network-data-AppDbSecretArn
          DB_PROXY_HOST: !ImportValue cyrokx-network-data-DbProxyEndpoint
          DB_NAME: !ImportValue cyrokx-network-data-DbName
          DB_SCHEMA: !If [HasDbSchema, !Ref DbSchema, !Ref AWS::NoValue]
          JWT_SECRET_ARN: !ImportValue cyrokx-network-data-JwtSigningSecretArn
          EMAIL_QUEUE_URL: !Ref EmailQueue
          BANNERS_BUCKET_NAME: !Ref BannersBucket
          BANNERS_CDN_DOMAIN: !GetAtt BannersDistribution.DomainName
          # Admin refund approval calls PayU to actually return the money.
          PAYU_SECRET_ARN: !If
            - ProdWantsLivePayU
            - !ImportValue cyrokx-network-data-PayUSecretArn
            - !ImportValue cyrokx-network-data-PayUTestSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !ImportValue cyrokx-network-data-AppDbSecretArn
                - !ImportValue cyrokx-network-data-JwtSigningSecretArn
                - !If
                  - ProdWantsLivePayU
                  - !ImportValue cyrokx-network-data-PayUSecretArn
                  - !ImportValue cyrokx-network-data-PayUTestSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EmailQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref BannersBucket
      Events:
        OrganiserSignup:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/auth/signup
            Method: post
            Auth:
              Authorizer: NONE
        OrganiserVerifyEmail:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/auth/verify-email
            Method: post
            Auth:
              Authorizer: NONE
        OrganiserLogin:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/auth/login
            Method: post
            Auth:
              Authorizer: NONE
        OrganiserRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/auth/refresh
            Method: post
            Auth:
              Authorizer: NONE
        OrganiserForgotPassword:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/auth/forgot-password
            Method: post
            Auth:
              Authorizer: NONE
        OrganiserResetPassword:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/auth/reset-password
            Method: post
            Auth:
              Authorizer: NONE
        CreateEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        SubmitEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/submit
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ListOrganiserEvents:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        GetOrganiserEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        UpdateOrganiserEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}
            Method: patch
            Auth:
              Authorizer: JwtAuthorizer
        CreateTicketTiers:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/ticket-tiers
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        CreateBannerUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/banner-upload-url
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ListFormFields:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/form-fields
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        ReplaceFormFields:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/form-fields
            Method: put
            Auth:
              Authorizer: JwtAuthorizer
        CreateImageUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/image-upload-url
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ReplaceEventImages:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/images
            Method: put
            Auth:
              Authorizer: JwtAuthorizer
        ListAttendees:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/attendees
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        AdminListOrderQueries:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/queries
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        AdminResolveOrderQuery:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/queries/{query_id}/resolve
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        AdminGetOrganiser:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        AdminUpdateOrganiser:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}
            Method: patch
            Auth:
              Authorizer: JwtAuthorizer
        AdminOrganiserImageUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}/image-upload-url
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        GetOrganiserMe:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/me
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        UpdateOrganiserMe:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/me
            Method: patch
            Auth:
              Authorizer: JwtAuthorizer
        OrganiserImageUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/me/image-upload-url
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        DeleteDraftEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}
            Method: delete
            Auth:
              Authorizer: JwtAuthorizer
        UpdateTicketTier:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/ticket-tiers/{tier_id}
            Method: put
            Auth:
              Authorizer: JwtAuthorizer
        DeleteTicketTier:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/ticket-tiers/{tier_id}
            Method: delete
            Auth:
              Authorizer: JwtAuthorizer
        ApproveTicket:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/tickets/{ticket_id}/approve
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        RejectTicket:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /organiser/events/{event_id}/tickets/{ticket_id}/reject
            Method: post
            Auth:
              Authorizer: JwtAuthorizer

  # Same code/handler/env as AuthenticatedApiFunction above -- authenticated_api's
  # Powertools resolver dispatches on path+method internally regardless of which
  # physical Lambda receives the invocation, so this is a pure infra-level split,
  # not a second copy of the application logic. Exists because API Gateway wires
  # each Api event as its own AWS::Lambda::Permission statement on the target
  # function's resource policy, which AWS caps at 20480 bytes -- one Lambda
  # fielding all of authenticated_api's ~64 routes exceeded that cap. Admin-facing
  # routes moved here; organiser-facing + shared auth routes stay above.
  AdminApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-admin-api-${Stage}
      CodeUri: ../../src/authenticated_api/
      Handler: handler.handler
      Layers:
        - !Ref CommonLayer
      VpcConfig:
        SubnetIds: !Split [',', !ImportValue cyrokx-network-data-PrivateSubnetIds]
        SecurityGroupIds:
          - !ImportValue cyrokx-network-data-LambdaSecurityGroupId
      Environment:
        Variables:
          DB_SECRET_ARN: !ImportValue cyrokx-network-data-AppDbSecretArn
          DB_PROXY_HOST: !ImportValue cyrokx-network-data-DbProxyEndpoint
          DB_NAME: !ImportValue cyrokx-network-data-DbName
          DB_SCHEMA: !If [HasDbSchema, !Ref DbSchema, !Ref AWS::NoValue]
          JWT_SECRET_ARN: !ImportValue cyrokx-network-data-JwtSigningSecretArn
          EMAIL_QUEUE_URL: !Ref EmailQueue
          BANNERS_BUCKET_NAME: !Ref BannersBucket
          BANNERS_CDN_DOMAIN: !GetAtt BannersDistribution.DomainName
          # Admin refund approval calls PayU to actually return the money.
          PAYU_SECRET_ARN: !If
            - ProdWantsLivePayU
            - !ImportValue cyrokx-network-data-PayUSecretArn
            - !ImportValue cyrokx-network-data-PayUTestSecretArn
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !ImportValue cyrokx-network-data-AppDbSecretArn
                - !ImportValue cyrokx-network-data-JwtSigningSecretArn
                - !If
                  - ProdWantsLivePayU
                  - !ImportValue cyrokx-network-data-PayUSecretArn
                  - !ImportValue cyrokx-network-data-PayUTestSecretArn
        - SQSSendMessagePolicy:
            QueueName: !GetAtt EmailQueue.QueueName
        - S3CrudPolicy:
            BucketName: !Ref BannersBucket
      Events:
        AdminLogin:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/auth/login
            Method: post
            Auth:
              Authorizer: NONE
        AdminRefresh:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/auth/refresh
            Method: post
            Auth:
              Authorizer: NONE
        ModerationQueue:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/moderation-queue
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        ApproveEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/events/{event_id}/approve
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        RejectEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/events/{event_id}/reject
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ListAllEvents:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/events
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        PublishEvent:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/events/{event_id}/publish
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ListOrganisers:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        SuspendOrganiser:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}/suspend
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ReactivateOrganiser:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/organisers/{organiser_id}/reactivate
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        ListTransactions:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/transactions
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        ListRefunds:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/refunds
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        ApproveRefund:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/refunds/{refund_id}/approve
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        RejectRefund:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/refunds/{refund_id}/reject
            Method: post
            Auth:
              Authorizer: JwtAuthorizer
        GetSettings:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/settings
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        UpdateSettings:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/settings
            Method: patch
            Auth:
              Authorizer: JwtAuthorizer
        GetHomepageAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/homepage
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
        ReplaceHomepageAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/homepage
            Method: put
            Auth:
              Authorizer: JwtAuthorizer
        ListCategoriesAdmin:
          Type: Api
          Properties:
            RestApiId: !Ref CyrokxApi
            Path: /admin/categories
            Method: get
            Auth:
              Authorizer: JwtAuthorizer
