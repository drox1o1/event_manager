AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CyRokx frontend -- public-site, organiser-portal, admin-panel. Each is a
  Next.js app (output: "standalone") run inside a zip-packaged Lambda via
  AWS Lambda Web Adapter (https://github.com/awslabs/aws-lambda-web-adapter),
  fronted by its own CloudFront distribution for HTTPS + edge caching of
  hashed static assets.

  Demo-grade simplification, to be revisited: Function URLs are AuthType
  NONE (reachable directly, bypassing CloudFront) rather than AWS_IAM +
  CloudFront Origin Access Control.

  Custom domains (showtik.in prod only -- see AcmCertificateArn) are
  showtik.in + www.showtik.in -> public-site, host.showtik.in ->
  organiser-portal, admin.showtik.in -> admin-panel. DNS itself (Route 53
  hosted zone, ALIAS records) is managed outside this template.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedPattern: "^[a-z][a-z0-9_]*$"
    Description: Deployment stage, e.g. dev or prod. Used in resource names.
  LambdaAdapterLayerArn:
    Type: String
    Default: arn:aws:lambda:ap-south-1:753240598075:layer:LambdaAdapterLayerX86:28
    Description: >
      AWS-published layer (account 753240598075) implementing the exec
      wrapper that runs each app's `node server.js` as a subprocess and
      proxies Function URL requests to it over HTTP.
  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      us-east-1 ACM cert covering showtik.in, www.showtik.in,
      host.showtik.in, admin.showtik.in (CloudFront only accepts certs from
      us-east-1, regardless of the distribution's own region). Leave blank
      to fall back to each distribution's default *.cloudfront.net domain
      with no custom Aliases -- used for the dev stage, which doesn't have
      its own subdomains.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref AcmCertificateArn, ""]]

Resources:
  # --- public-site ---

  PublicSiteFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-public-site-${Stage}
      CodeUri: ../../.build/frontend/public-site
      Handler: run.sh
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 30
      Layers: [!Ref LambdaAdapterLayerArn]
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE

  PublicSiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, ["showtik.in", "www.showtik.in"], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: lambda-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: lambda-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
        Origins:
          - Id: lambda-origin
            DomainName: !Select [2, !Split ["/", !GetAtt PublicSiteFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

  # --- organiser-portal ---

  OrganiserPortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-organiser-portal-${Stage}
      CodeUri: ../../.build/frontend/organiser-portal
      Handler: run.sh
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 30
      Layers: [!Ref LambdaAdapterLayerArn]
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE

  OrganiserPortalDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, ["host.showtik.in"], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: lambda-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: lambda-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        Origins:
          - Id: lambda-origin
            DomainName: !Select [2, !Split ["/", !GetAtt OrganiserPortalFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

  # --- admin-panel ---

  AdminPanelFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cyrokx-admin-panel-${Stage}
      CodeUri: ../../.build/frontend/admin-panel
      Handler: run.sh
      Runtime: nodejs22.x
      Architectures: [x86_64]
      MemorySize: 1024
      Timeout: 30
      Layers: [!Ref LambdaAdapterLayerArn]
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE

  AdminPanelDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        Aliases: !If [HasCustomDomain, ["admin.showtik.in"], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        DefaultCacheBehavior:
          TargetOriginId: lambda-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
        CacheBehaviors:
          - PathPattern: /_next/static/*
            TargetOriginId: lambda-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        Origins:
          - Id: lambda-origin
            DomainName: !Select [2, !Split ["/", !GetAtt AdminPanelFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]

Outputs:
  PublicSiteUrl:
    Value: !Sub https://${PublicSiteDistribution.DomainName}
  OrganiserPortalUrl:
    Value: !Sub https://${OrganiserPortalDistribution.DomainName}
  AdminPanelUrl:
    Value: !Sub https://${AdminPanelDistribution.DomainName}
