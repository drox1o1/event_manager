[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: line length isn't worth fighting over.
# UP042: `class X(str, enum.Enum)` is deliberate (SQLAlchemy Enum columns +
# clean JSON serialization via model_dump), not something to migrate to
# enum.StrEnum.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/authenticated_api is on the path in its own right (not just as the
# `authenticated_api` package via `src`) because its CodeUri in
# infra/app/template.yaml deploys that directory's *contents* as the Lambda
# root -- handler.py and its sibling modules (app.py, events_service.py, ...)
# import each other with plain top-level names (`import app`, not
# `from . import app`), matching how they resolve once deployed.
pythonpath = ["src/layers/common", "src", "src/authenticated_api"]
