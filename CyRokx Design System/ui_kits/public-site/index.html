<!-- @dsCard group="Public Site" viewport="1280x800" name="Public Site" subtitle="Homepage → Listing → Detail → Checkout → Confirmation, no login" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CyRokx — Public Site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface-page);}
  .demo-bar{position:sticky;top:0;z-index:50;display:flex;gap:8px;padding:10px 16px;background:var(--color-ink);overflow-x:auto;}
  .demo-bar button{flex:none;background:none;border:1px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.7);border-radius:999px;padding:6px 14px;font-size:12px;font-family:var(--font-sans);cursor:pointer;}
  .demo-bar button.active{background:var(--color-accent);border-color:var(--color-accent);color:#fff;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Homepage.jsx"></script>
<script type="text/babel" src="EventListing.jsx"></script>
<script type="text/babel" src="EventDetail.jsx"></script>
<script type="text/babel" src="Checkout.jsx"></script>
<script type="text/babel" src="OrderConfirmation.jsx"></script>
<script type="text/babel" src="CategoryPage.jsx"></script>
<script type="text/babel" src="CityPage.jsx"></script>
<script type="text/babel" src="ErrorStates.jsx"></script>
<script type="text/babel">
  const { Navbar, Footer } = window.CyRokxDesignSystem_ef2ebf;

  function App() {
    const [screen, setScreen] = React.useState('home');
    const [total, setTotal] = React.useState(899);
    const screens = ['home', 'listing', 'detail', 'checkout', 'confirmation', 'category', 'city', 'errors'];
    const labels = { home: 'Homepage', listing: 'Listing', detail: 'Event Detail', checkout: 'Checkout', confirmation: 'Confirmation', category: 'Category Page', city: 'City Page', errors: 'Error / Empty / Fail' };

    return (
      <div>
        <div className="demo-bar">
          {screens.map((s) => (
            <button key={s} className={s === screen ? 'active' : ''} onClick={() => setScreen(s)}>{labels[s]}</button>
          ))}
        </div>
        <Navbar onSearchClick={() => setScreen('listing')} />
        {screen === 'home' && <Homepage onOpenEvent={() => setScreen('detail')} onSearch={() => setScreen('listing')} />}
        {screen === 'listing' && <EventListing onOpenEvent={() => setScreen('detail')} />}
        {screen === 'detail' && <EventDetail onBuy={(t) => { setTotal(t); setScreen('checkout'); }} />}
        {screen === 'checkout' && <Checkout total={total} onPay={() => setScreen('confirmation')} />}
        {screen === 'confirmation' && <OrderConfirmation onBackHome={() => setScreen('home')} />}
        {screen === 'category' && <CategoryPage category="Music" onOpenEvent={() => setScreen('detail')} onBackHome={() => setScreen('home')} />}
        {screen === 'city' && <CityPage city="Mumbai" onOpenEvent={() => setScreen('detail')} onBackHome={() => setScreen('home')} />}
        {screen === 'errors' && <ErrorStates onBackHome={() => setScreen('home')} onRetryPayment={() => setScreen('checkout')} />}
        <Footer />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
