<!-- @dsCard group="Colors" viewport="700x200" name="Color in Use" subtitle="Price and links carry the accent; everything else stays neutral" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-page);}
  .card{margin:16px;padding:20px 24px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);}
  h3{margin:0 0 6px;color:var(--text-heading);font-size:20px;font-weight:700;}
  p{margin:0 0 12px;color:var(--text-muted);font-size:14px;}
  .price{color:var(--color-accent);font-weight:700;font-size:22px;}
  a{color:var(--text-link);text-decoration:none;font-weight:600;font-size:14px;}
</style>
</head>
<body>
  <div class="card">
    <h3>Jazz Night at The Terrace</h3>
    <p>Sat, 12 Jul &middot; Bandra, Mumbai</p>
    <div class="price">from &#8377;799 <a href="#" style="margin-left:14px;">View tiers &rarr;</a></div>
  </div>
</body>
</html>
