<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing Steps" subtitle="8pt grid — 4, 8, 12, 16, 24, 32, 48, 64" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-card);padding:20px;box-sizing:border-box;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:10px;}
  .bar{background:var(--color-accent);height:14px;border-radius:2px;}
  .lbl{width:70px;font-size:12px;font-family:monospace;color:var(--text-subtle);}
</style>
</head>
<body>
  <div class="row"><div class="lbl">4px</div><div class="bar" style="width:4px;"></div></div>
  <div class="row"><div class="lbl">8px</div><div class="bar" style="width:8px;"></div></div>
  <div class="row"><div class="lbl">12px</div><div class="bar" style="width:12px;"></div></div>
  <div class="row"><div class="lbl">16px</div><div class="bar" style="width:16px;"></div></div>
  <div class="row"><div class="lbl">24px</div><div class="bar" style="width:24px;"></div></div>
  <div class="row"><div class="lbl">32px</div><div class="bar" style="width:32px;"></div></div>
  <div class="row"><div class="lbl">48px</div><div class="bar" style="width:48px;"></div></div>
  <div class="row"><div class="lbl">64px</div><div class="bar" style="width:64px;"></div></div>
</body>
</html>
