<!-- @dsCard group="Type" viewport="700x260" name="Type in Context" subtitle="Hierarchy on a real card: H2 title, body description, caption meta" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:16px;box-sizing:border-box;}
  .card{max-width:520px;margin:0 auto;padding:24px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--shadow-card);}
  h2{margin:0 0 8px;font-size:var(--text-h2-size);line-height:var(--text-h2-line);font-weight:700;color:var(--text-heading);}
  p{margin:0 0 12px;font-size:var(--text-body-size);line-height:var(--text-body-line);color:var(--text-body);}
  .meta{font-size:var(--text-caption-size);color:var(--text-subtle);text-transform:uppercase;letter-spacing:0.04em;font-weight:600;margin-bottom:8px;}
</style>
</head>
<body>
  <div class="card">
    <div class="meta">Music &middot; Mumbai</div>
    <h2>Jazz Night at The Terrace</h2>
    <p>An intimate evening of live jazz with local and touring artists. Doors at 7, first set at 8.</p>
  </div>
</body>
</html>
