<!-- @dsCard group="Radius & Shadow" viewport="700x190" name="Elevation" subtitle="Soft shadows, not hard borders — cards lift further on hover" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:24px;box-sizing:border-box;}
  .row{display:flex;gap:24px;}
  .card{width:150px;height:100px;background:var(--surface-card);border-radius:var(--radius-card);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted);font-family:monospace;}
</style>
</head>
<body>
  <div class="row">
    <div class="card" style="box-shadow:var(--shadow-card);">shadow-card</div>
    <div class="card" style="box-shadow:var(--shadow-card-hover);">shadow-card-hover</div>
    <div class="card" style="box-shadow:var(--shadow-modal);">shadow-modal</div>
  </div>
</body>
</html>
