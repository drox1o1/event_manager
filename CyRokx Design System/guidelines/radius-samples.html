<!-- @dsCard group="Radius & Shadow" viewport="700x180" name="Radius Samples" subtitle="8 inputs/buttons · 12 cards · 16 modals · pill for tags/avatars" -->
<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface-page);padding:20px;box-sizing:border-box;}
  .row{display:flex;gap:20px;align-items:center;}
  .box{background:var(--surface-card);border:1px solid var(--border-default);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-family:monospace;color:var(--text-muted);gap:4px;}
</style>
</head>
<body>
  <div class="row">
    <div class="box" style="width:90px;height:60px;border-radius:var(--radius-control);">8px</div>
    <div class="box" style="width:90px;height:60px;border-radius:var(--radius-card);">12px</div>
    <div class="box" style="width:90px;height:60px;border-radius:var(--radius-modal);">16px</div>
    <div class="box" style="width:90px;height:60px;border-radius:var(--radius-pill);">pill</div>
  </div>
</body>
</html>
