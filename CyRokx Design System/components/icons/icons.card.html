<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--font-sans);background:var(--surface-card);}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Icon } = window.CyRokxDesignSystem_ef2ebf;
  const names = ['search','map-pin','calendar','chevron-down','star','ticket','filter','check-circle','arrow-right'];
  function Demo(){
    return (
      <div style={{display:'flex',gap:'20px',padding:'20px',alignItems:'center',flexWrap:'wrap'}}>
        {names.map(n => (
          <div key={n} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'6px',color:'var(--text-muted)',fontSize:'10px',fontFamily:'monospace'}}>
            <Icon name={n} size={22} color="var(--color-ink)" />
            {n}
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
